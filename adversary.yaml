name: adversarylabs/review/conventions
version: 0.0.2
description: Reviews changed code against declared repository rules and well-supported conventions inferred from existing code.

triggers:
  manual: true

detection:
  files:
    - "**/*"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write: []
  network: false
  model: true
  environment:
    allow: []

findings:
  format: adversary.review.v1
